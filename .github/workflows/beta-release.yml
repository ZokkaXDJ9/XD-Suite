name: Branch beta release
run-name: Beta · ${{ github.ref_name }} · ${{ github.run_number }}.${{ github.run_attempt }}

on:
  push:
    branches: ['app/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  beta:
    if: github.repository == 'ZokkaXDJ9/XD-Suite' && startsWith(github.ref, 'refs/heads/app/')
    runs-on: windows-2022
    timeout-minutes: 35
    permissions:
      contents: write
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 9.0.306
      - name: Prepare, build and test branch beta
        run: ./tools/ci-beta.ps1 -Action Build
      - name: Publish verified prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./tools/ci-beta.ps1 -Action Publish
      - name: Upload test reports and previews
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: beta-checks-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/beta/*.txt
            artifacts/beta/*.png
            artifacts/beta/*.json
            artifacts/beta/*.md
            artifacts/beta/installer-test-*/installed-tests.txt
          if-no-files-found: warn
          retention-days: 14
